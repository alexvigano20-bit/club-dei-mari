# Evita la sospensione per inattività del piano gratuito Supabase (~7 giorni senza uso).
# Indirizzo e chiave PUBBLICA del progetto (non sono segreti: sono già nell'app).
name: keep-alive
on:
  schedule: [{ cron: '17 6 * * *' }]   # ogni giorno
  workflow_dispatch: {}
env:
  SUPABASE_URL: https://vvhagrneqfnuzvthdlyx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZFK7Z0SrTQPrZtcW4zvx3Q_AfOvhk9j
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; test "$code" = "200"
